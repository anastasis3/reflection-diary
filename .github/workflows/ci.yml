name: CI

# Runs on every push and on every pull request to the main branch. The point
# of this file is that a change which breaks the API, the adaptation model or
# the start-up of the server is visible before it reaches main, rather than
# when someone next tries to run it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Tests on Node ${{ matrix.node }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The current LTS and the current release. Testing on both catches a
        # dependence on something that only exists in the newer one.
        node: ['20.x', '22.x']

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        # `npm ci` installs exactly what package-lock.json pins, so CI runs
        # against the same versions as a developer's machine.
        run: npm ci

      - name: Check every source file parses
        run: |
          find src tests scripts -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Audit dependencies
        # Advisory: a new high-severity advisory should be seen, but it must
        # not block a pull request that did not cause it.
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Run the test suite
        run: npm test
        env:
          NODE_ENV: test

  smoke:
    name: The server starts and answers
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - run: npm ci

      - name: Start the server, then walk through the main flow
        # A test suite can pass while the process itself fails to start —
        # a bad environment variable, a missing directory. This step runs the
        # real server and takes an account from registration to a saved entry.
        run: |
          npm start &
          SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT

          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health > /dev/null; then break; fi
            sleep 1
          done

          echo "--- health ---"
          curl -sf http://localhost:3000/api/health

          echo "--- the interface is served ---"
          curl -sf http://localhost:3000/ | grep -q "reflection diary"

          echo "--- the documentation is served ---"
          curl -sf http://localhost:3000/docs/openapi.yaml | head -1

          echo "--- register ---"
          TOKEN=$(curl -sf -X POST http://localhost:3000/api/auth/register \
            -H 'content-type: application/json' \
            -d '{"email":"ci@example.test","password":"correct horse battery","acceptPrivacyNotice":true,"acceptAiProcessing":true}' \
            | node -pe 'JSON.parse(require("fs").readFileSync(0)).token')
          test -n "$TOKEN"

          echo "--- the quiz ---"
          for ZONE in work people health energy emotion self interest meaning everyday; do
            curl -sf -X POST http://localhost:3000/api/onboarding/answers \
              -H "authorization: Bearer $TOKEN" -H 'content-type: application/json' \
              -d "{\"zoneId\":\"$ZONE\",\"value\":4}" > /dev/null
          done
          curl -sf -X POST http://localhost:3000/api/onboarding/complete \
            -H "authorization: Bearer $TOKEN" > /dev/null

          echo "--- today's three questions ---"
          QID=$(curl -sf http://localhost:3000/api/prompts/today -H "authorization: Bearer $TOKEN" \
            | node -pe 'const r=JSON.parse(require("fs").readFileSync(0)); if(r.questions.length!==3) process.exit(1); r.questions[0].promptShownId')
          echo "picked $QID"
          curl -sf -X POST http://localhost:3000/api/prompts/$QID/choose -H "authorization: Bearer $TOKEN"

          echo ""
          echo "--- answer it ---"
          curl -sf -X POST http://localhost:3000/api/entries \
            -H "authorization: Bearer $TOKEN" -H 'content-type: application/json' \
            -d "{\"text\":\"Three meetings at the office that could have been one message.\",\"promptShownId\":\"$QID\"}" \
            | node -pe 'const r=JSON.parse(require("fs").readFileSync(0)); if(r.analysis!=="classified") { console.error(r); process.exit(1) } "analysis: "+r.analysis+", moved "+r.weightChanges.length+" zones"'

          echo "--- delete the account again ---"
          curl -sf -X DELETE http://localhost:3000/api/account -H "authorization: Bearer $TOKEN"
        env:
          NODE_ENV: production
          JWT_SECRET: a-secret-used-only-by-this-ci-run
          PORT: 3000

  postgres:
    name: Supabase driver on PostgreSQL 16
    runs-on: ubuntu-latest
    needs: test

    # The same migrations that go to Supabase, applied to a plain PostgreSQL,
    # then the API run against them. Supabase Auth has no local equivalent, so
    # supabase/local/00_auth_stub.sql provides auth.users and auth.uid(), and
    # the test replaces the Auth calls with a stub (see the test file).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rd_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10

    env:
      PGPASSWORD: postgres
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/rd_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - run: npm ci

      - name: Apply the auth stub, the migrations and the test data
        run: |
          for f in supabase/local/00_auth_stub.sql supabase/migrations/*.sql supabase/seed/test_data.sql; do
            echo "== $f"
            psql -h localhost -U postgres -d rd_test -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: Schema checks (RLS, constraints, triggers, three questions a day)
        run: |
          psql -h localhost -U postgres -d rd_test -f supabase/seed/checks.sql | tee checks.log
          ! grep -q FAIL checks.log

      - name: The API on the Supabase driver
        run: node --test tests/postgres/postgres.test.js

  docs:
    name: The OpenAPI description is valid
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Parse docs/openapi.yaml
        # A description that no longer parses is worse than none, because the
        # documentation page silently falls back to an error message.
        run: npx --yes js-yaml@4.1.0 docs/openapi.yaml > /dev/null

      - name: Check that every route in the code appears in the description
        # Keeps the two from drifting apart: a new endpoint without a line in
        # openapi.yaml fails here rather than being noticed months later.
        run: node scripts/check-docs.js
